name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Estilo y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - name: Ruff (reglas)
        run: uv run ruff check src tests
      - name: Ruff (formato)
        run: uv run ruff format --check src tests
      - name: mypy
        run: uv run mypy

  pruebas:
    name: Pruebas unitarias y de la API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run pytest -m "not slow" --cov --cov-report=term

  pipeline:
    name: Pipeline completo (integración)
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run pytest -m slow

  web:
    name: Interfaz web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Datos de la última corrida
        run: uv run cancerstats web-data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dependencias
        working-directory: web
        run: npm ci
      - name: ESLint, tipos y pruebas unitarias
        working-directory: web
        run: npm run lint && npm run typecheck && npm test
      - name: Compilación
        working-directory: web
        run: npm run build
      - name: Pruebas de extremo a extremo (escritorio y móvil)
        working-directory: web
        run: npx playwright install --with-deps chromium && npm run e2e

  informe:
    name: Informe LaTeX (sin errores ni advertencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilación con LuaLaTeX y biber
        uses: xu-cheng/texlive-action@v2
        with:
          scheme: full
          run: |
            cd report
            mkdir -p build dist
            latexmk informe.tex
      - name: Registro sin advertencias ni cajas mal llenas
        run: python3 scripts/check_latex_log.py report/build/informe.log
