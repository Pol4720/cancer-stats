  if (compact) { w = 460; left = 0; rowH = 62; }
  const max = Math.max(...rows.map((r) => r.v), ref || 0) * 1.08, min = Math.min(...rows.map((r) => r.v)) * 0.9;
  const x0 = Math.max(0, min - (max - min) * 0.4), X = (v) => left + ((v - x0) / (max - x0)) * (w - left - 70);
  const h = rows.length * rowH + 10;
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">`;
  rows.forEach((r, i) => {
    const y = i * rowH + 6, bw = X(r.v) - left, c = r.chosen ? "var(--s2)" : "var(--s1)";
    const by = compact ? y + 24 : y + 6, bh = compact ? 26 : rowH - 18;
    s += `<g class="mk" data-tip="${esc(r.label)}: ${num(r.v, fmt)}">`;
    s += compact
      ? `<text x="0" y="${y + 16}" font-size="17" fill="var(--ink)">${esc(r.label)}</text>`
      : `<text x="${left - 14}" y="${y + rowH / 2}" text-anchor="end" font-size="17" fill="var(--ink)">${esc(r.label)}</text>`;
    s += `<rect class="grow" style="--d:${i};--w:${bw}px" x="${left}" y="${by}" height="${bh}" rx="6" fill="${c}" width="${bw}"/>`;
    s += `<text x="${left + bw + 10}" y="${by + bh / 2 + 6}" font-size="17" font-weight="700" fill="var(--ink)">${num(r.v, fmt)}</text></g>`;
  });
  if (ref) s += `<line x1="${X(ref)}" x2="${X(ref)}" y1="0" y2="${h}" stroke="var(--s8)" stroke-dasharray="6 6" stroke-width="2"/>`;
  return s + "</svg>";
}
function varianceChart(v) {
  const w = 900, h = 380, l = 70, b = 50, xs = v.mids.map(Math.log10), x0 = Math.min(...xs), x1 = Math.max(...xs);
  const ys = [...v.ols, ...(v.wls || [])], y1 = Math.max(...ys) * 1.1;
  const X = (x) => l + ((Math.log10(x) - x0) / (x1 - x0)) * (w - l - 20), Y = (y) => h - b - (y / y1) * (h - b - 10);
  const path = (arr) => arr.map((y, i) => `${i ? "L" : "M"}${X(v.mids[i])},${Y(y)}`).join("");
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">`;
  niceTicks(0, y1, 4).forEach((t) => (s += `<line x1="${l}" x2="${w - 20}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/><text x="${l - 10}" y="${Y(t) + 5}" text-anchor="end" font-size="15">${num(t, 0)}</text>`));
  [1e3, 1e4, 1e5, 1e6].filter((t) => Math.log10(t) >= x0 - 0.01 && Math.log10(t) <= x1 + 0.01).forEach((t) => (s += `<text x="${X(t)}" y="${h - 18}" text-anchor="middle" font-size="15">${num(t, 0)}</text>`));
  s += `<text x="${(w + l) / 2}" y="${h}" text-anchor="middle" font-size="15">Población del condado (escala logarítmica)</text>`;
  s += `<path class="draw" d="${path(v.ols)}" fill="none" stroke="var(--s2)" stroke-width="4" stroke-linejoin="round"/>`;
  v.ols.forEach((y, i) => (s += `<circle class="mk" data-tip="MCO: varianza ${num(y, 0)}" cx="${X(v.mids[i])}" cy="${Y(y)}" r="7" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>`));
  if (v.wls) {
    s += `<path class="draw" style="--d:3" d="${path(v.wls)}" fill="none" stroke="var(--s1)" stroke-width="4" stroke-linejoin="round"/>`;
    v.wls.forEach((y, i) => (s += `<rect class="mk" data-tip="Ponderado: ${num(y, 0)}" x="${X(v.mids[i]) - 6}" y="${Y(y) - 6}" width="12" height="12" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>`));
  }
  return s + "</svg>";
}

// ------------------------------------------------------------------ diapositivas
const fit = D.fit, P = D.prediction;
const pctR2 = num(100 * fit.r2, 1);
const SLIDES = [

      <div class="tile reveal" style="--d:3"><div class="big" data-count="${D.rules.total}" data-dec="0">0</div><div class="unit">reglas de validación</div></div>

  () => `<div class="inner"><div class="eyebrow reveal">Depuración</div>

    <div class="problems" style="margin-top:1em">${D.problems.map((p, i) => `<div class="tile problem reveal" style="--d:${i + 2}"><div class="mid" data-count="${p.n}" data-dec="0">0</div><div class="unit">${esc(p.title)}</div></div>`).join("")}</div>
    <p class="lead wide reveal" style="--d:7;margin-top:1em">Cada corrección se apoya en una regla que la detecta y una comprobación que la verifica.</p></div>`,
  () => `<div class="inner"><div class="eyebrow reveal">Datos ausentes</div>
    <h2 class="reveal" style="--d:1">La incidencia falta por estados enteros.</h2>
    <div class="grid g2" style="margin-top:1em">
      <div class="tile reveal" style="--d:2"><div class="label">Little · variables dispersas</div><div class="mid">${pv(D.little.random_p)}</div><div class="unit">compatible con MCAR</div></div>
      <div class="tile reveal" style="--d:3"><div class="label">Little · con la incidencia</div><div class="mid">${pv(D.little.all_p)}</div><div class="unit">ausencia estructural: MAR dado el estado</div></div>
    </div>
    <p class="lead wide reveal" style="--d:4;margin-top:1em">Casos completos en el modelo; imputación múltiple como comprobación.</p></div>`,
  () => `<div class="inner"><div class="eyebrow reveal">Construcción del modelo</div>
    <h2 class="reveal" style="--d:1">De ${D.steps[0].n} candidatas a ${D.steps[D.steps.length - 1].n} términos.</h2>
    <div class="funnel" style="margin-top:1em">${D.steps.map((s, i) => `<div class="step reveal" style="--d:${i + 1}"><span>${esc(s.label)}</span><div class="bar" style="--d:${i};--w:${(100 * s.n) / D.steps[0].n}%">${s.n}</div></div>`).join("")}</div></div>`,
  () => `<div class="inner"><div class="eyebrow reveal">Estructura del error</div>
    <h2 class="reveal" style="--d:1">Los condados pequeños son más ruidosos.</h2>
    <div class="grid g2" style="align-items:center">
      <div class="reveal" style="--d:2">${varianceChart(D.variance)}<div class="legend"><span style="--c:var(--s2)">Residuos MCO</span><span style="--c:var(--s1)">Ponderados por σ²(n)</span></div></div>
      <div class="reveal" style="--d:3"><p class="lead">σ²(n) = a + b/n, y los condados de un mismo estado se parecen (correlación intraclase ${num(D.icc, 3)}).</p>
      <p class="pill" style="margin-top:1em">MCO + errores típicos por estado (${fit.states} conglomerados)</p></div>
    </div></div>`,
  () => `<div class="inner"><div class="eyebrow reveal">Modelo final · MCO</div>
    <h2 class="reveal" style="--d:1">Explica el ${pctR2}&nbsp;% de la variabilidad.</h2>
    <div class="grid g4" style="margin-top:1em">
      <div class="tile reveal" style="--d:2"><div class="label">R²</div><div class="mid" data-count="${fit.r2}" data-dec="3">0</div></div>
      <div class="tile reveal" style="--d:3"><div class="label">R² ajustado</div><div class="mid" data-count="${fit.r2_adj}" data-dec="3">0</div></div>
      <div class="tile reveal" style="--d:4"><div class="label">RMSE</div><div class="mid" data-count="${fit.rmse}" data-dec="2">0</div><div class="unit">muertes / 100&#8239;000</div></div>
      <div class="tile reveal" style="--d:5"><div class="label">Durbin-Watson</div><div class="mid" data-count="${fit.dw}" data-dec="3">0</div></div>
    </div>
    <p class="lead wide reveal" style="--d:6;margin-top:1em">n = ${num(fit.n, 0)} condados · k = ${fit.k} regresores · salida tipo SPSS y sintaxis reproducible.</p></div>`,
  () => `<div class="inner"><div class="eyebrow reveal">Interpretación</div>
    <h2 class="reveal" style="--d:1">Del primer al tercer cuartil, a igualdad del resto.</h2>
    <div class="reveal" style="--d:2">${forest(D.effects.filter((e) => !e.region), { rowH: 34, fmt: 1, fit: true })}</div>
    <div class="legend reveal" style="--d:3"><span style="--c:var(--s1)">Significativo (relleno) · no significativo (hueco); IC 95&nbsp;% robusto</span>${D.slopes.length ? `<span style="--c:var(--s2)">${esc(D.slopes.map((s) => s.label).join(" y "))}: por región, en la siguiente</span>` : ""}</div></div>`,
  () => `<div class="inner"><div class="eyebrow reveal">Interacciones</div>
    <h2 class="reveal" style="--d:1">El efecto de la educación depende de la región.</h2>
    <div class="grid g2">${D.slopes.map((sl, j) => `<div class="tile reveal" style="--d:${j + 2}"><div class="label">${esc(sl.label)} · pendiente por punto</div>${forest(sl.rows.map((r, i) => ({ label: r.region, v: r.v, lo: r.lo, hi: r.hi, sig: r.sig, color: ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)"][i] })), { w: 600, left: 170, rowH: 44, fmt: 2 })}</div>`).join("")}</div></div>`,
  () => `<div class="inner"><div class="eyebrow reveal">Diagnóstico</div>
    <h2 class="reveal" style="--d:1">Cada violación tiene respuesta.</h2>
    <div class="check" style="margin-top:.6em">${D.diagnostics.map((d, i) => {
      const ok = d.p == null || d.p >= 0.05;
      return `<span class="reveal" style="--d:${i + 2};font-weight:700">${d.name}</span><span class="reveal muted" style="--d:${i + 2}">${d.test}: ${d.p == null ? num(d.value, 2) : pv(d.p)}</span><span class="status reveal" style="--d:${i + 2};color:${ok ? "var(--good)" : "var(--serious)"}">${ok ? "✓" : "⚠"} ${d.action}</span>`;
    }).join("")}</div></div>`,
  () => `<div class="inner"><div class="eyebrow reveal">Sensibilidad</div>
    <h2 class="reveal" style="--d:1">La conclusión no depende de las decisiones.</h2>
    <div class="reveal" style="--d:2">${forest(D.sensitivity.rows, { rowH: 34, left: 470, fmt: 3, fit: true })}</div>
    <p class="lead wide reveal" style="--d:3">Coeficiente de «${esc(D.sensitivity.term)}» en el Sur bajo cada especificación.</p></div>`,
  () => `<div class="inner"><div class="eyebrow reveal">Predicción</div>
    <h2 class="reveal" style="--d:1">${esc(P.chosen || "—")}: RMSE ${num(P.test_rmse, 2)} en prueba.</h2>
    <div class="reveal" style="--d:2">${bars(P.cv.map((r) => ({ label: r.label, v: r.rmse, chosen: r.chosen })), { rowH: 46, left: 400 })}</div>
    <p class="lead wide reveal" style="--d:3">RMSE de validación cruzada; la media sola falla por ${num(P.baseline, 1)}.</p></div>`,
  () => `<div class="inner"><div class="eyebrow reveal">Conclusiones</div>
    <h2 class="reveal" style="--d:1">Lo que asocia un condado con más mortalidad por cáncer:</h2>
    <div class="grid g3" style="margin-top:1em">
      <div class="tile reveal" style="--d:2"><div class="mid" style="color:var(--s8)">↑</div><div class="unit" style="font-size:clamp(1.1rem,2vw,1.6rem);color:var(--ink)">Más incidencia y más cobertura sólo pública</div></div>
      <div class="tile reveal" style="--d:3"><div class="mid" style="color:var(--s1)">↓</div><div class="unit" style="font-size:clamp(1.1rem,2vw,1.6rem);color:var(--ink)">Más titulados universitarios (salvo en el Noreste)</div></div>
      <div class="tile reveal" style="--d:4"><div class="mid" style="color:var(--s4)">≈</div><div class="unit" style="font-size:clamp(1.1rem,2vw,1.6rem);color:var(--ink)">Asociaciones ecológicas, no causales</div></div>
    </div>
    <p class="lead wide reveal" style="--d:5;margin-top:1.2em">Gracias. Preguntas.</p></div>`,
];

// ------------------------------------------------------------------ navegación
const deck = document.getElementById("deck"), dots = document.getElementById("dots");
SLIDES.forEach((make, i) => {
  const s = document.createElement("section");
  s.className = "slide"; s.setAttribute("aria-label", `Diapositiva ${i + 1} de ${SLIDES.length}`);
  s.innerHTML = make();
  deck.appendChild(s);
  const b = document.createElement("button");
  b.setAttribute("aria-label", `Ir a la diapositiva ${i + 1}`);
  b.onclick = () => go(i);
  dots.appendChild(b);
});
const slides = [...deck.children];
let wasNarrow = narrow();
addEventListener("resize", () => {
  if (narrow() === wasNarrow) return;
  wasNarrow = narrow();
  slides.forEach((s, i) => (s.innerHTML = SLIDES[i]()));
  if (cur >= 0) animate(slides[cur]);
});
let cur = -1;
function countUp(el) {
  const target = +el.dataset.count, dec = +el.dataset.dec, t0 = performance.now(), dur = 1100;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const step = (t) => {
    const k = reduce ? 1 : Math.min(1, (t - t0) / dur), e = 1 - (1 - k) ** 3;
    el.textContent = num(target * e, dec);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function animate(s) {
  s.querySelectorAll("[data-count]").forEach(countUp);
  s.querySelectorAll(".funnel .bar").forEach((b) => { b.style.width = "0"; requestAnimationFrame(() => requestAnimationFrame(() => (b.style.width = b.style.getPropertyValue("--w")))); });
  s.querySelectorAll("rect.grow").forEach((r, i) => { const w = r.getAttribute("width"); r.setAttribute("width", "0"); r.animate([{ width: "0px" }, { width: w + "px" }], { duration: 900, delay: 250 + i * 90, easing: "cubic-bezier(.2,.7,.2,1)", fill: "forwards" }); setTimeout(() => r.setAttribute("width", w), 1300 + i * 90); });
  s.querySelectorAll("path.draw").forEach((p, i) => { const L = p.getTotalLength(); p.animate([{ strokeDasharray: L, strokeDashoffset: L }, { strokeDasharray: L, strokeDashoffset: 0 }], { duration: 1400, delay: 300 + i * 400, easing: "ease-out", fill: "backwards" }); });
  s.querySelectorAll("g.mk").forEach((g, i) => g.animate([{ opacity: 0, transform: "translateX(-14px)" }, { opacity: 1, transform: "none" }], { duration: 500, delay: 250 + i * 55, easing: "ease-out", fill: "backwards" }));
}
function go(i) {
  i = Math.max(0, Math.min(slides.length - 1, i));
  if (i === cur) return;
  slides.forEach((s, j) => { s.classList.toggle("active", j === i); s.classList.toggle("past", j < i); s.setAttribute("aria-hidden", j === i ? "false" : "true"); });
  [...dots.children].forEach((d, j) => d.setAttribute("aria-current", j === i ? "true" : "false"));
  document.getElementById("counter").textContent = `${i + 1} / ${slides.length}`;
  document.getElementById("progress").style.width = `${((i + 1) / slides.length) * 100}%`;
  cur = i;
  history.replaceState(null, "", `#${i + 1}`);
  animate(slides[i]);
}
document.getElementById("prev").onclick = () => go(cur - 1);
document.getElementById("next").onclick = () => go(cur + 1);
function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("cs-pres-theme", root.dataset.theme); } catch (e) {}
}
document.getElementById("theme").onclick = toggleTheme;
document.getElementById("full").onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
addEventListener("keydown", (e) => {
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(slides.length - 1);
  else if (e.key.toLowerCase() === "t") toggleTheme();
  else if (e.key.toLowerCase() === "f") document.getElementById("full").click();
});
let x0 = null, y0 = null;
addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
addEventListener("touchend", (e) => {
  if (x0 == null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(cur + (dx < 0 ? 1 : -1));
  x0 = null;
});
const tip = document.getElementById("tip");
addEventListener("pointermove", (e) => {
  const t = e.target.closest?.("[data-tip]");
  if (!t) { tip.style.opacity = 0; return; }
  tip.textContent = t.dataset.tip; tip.style.opacity = 1;
  tip.style.left = Math.min(innerWidth - tip.offsetWidth - 10, e.clientX + 14) + "px"; tip.style.top = e.clientY + 14 + "px";
});
go(Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
</script>
</body>
