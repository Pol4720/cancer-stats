[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cancerstats"
version = "1.0.0"
description = "Análisis estadístico reproducible de la mortalidad por cáncer en los condados de EE. UU.: depuración, exploración, modelo de efectos y modelo predictivo."
readme = "README.md"
license = "MIT"
authors = [
  { name = "Richard Alejandro Matos Arderí" },
  { name = "Abel Ponce González" },
  { name = "Lidier Robayna" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Natural Language :: Spanish",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "statsmodels>=0.14.2",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pyreadstat>=1.3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "types-PyYAML>=6.0",
]

[project.scripts]
cancerstats = "cancerstats.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cancerstats"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "NPY", "PD", "RUF", "C4", "PIE", "PT", "RET"]
ignore = [
  "RUF001",  # el texto en castellano usa caracteres tipográficos legítimos
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PD"]
# Las filas de las tablas LaTeX son cadenas largas que pierden legibilidad si se parten.
"src/cancerstats/export/latex.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
files = ["src/cancerstats"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: pruebas que ejecutan el pipeline completo (más de unos segundos)",
]
filterwarnings = [
  "error::FutureWarning:cancerstats",
  "ignore:Using `httpx` with `starlette.testclient`",
  "error::DeprecationWarning:cancerstats",
  "error::matplotlib.MatplotlibDeprecationWarning",
]

[tool.coverage.run]
source = ["cancerstats"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
